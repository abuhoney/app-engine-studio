<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0d1117">
<title>Bardom AI - مولد التطبيقات</title>
<link rel="stylesheet" href="css/main.css">
<style>
  :root {
    --bg: #0d1117; --surface: #161b22; --surface2: #21262d; --border: #30363d;
    --text: #e6edf3; --text2: #8b949e; --text3: #484f58;
    --accent: #58a6ff; --accent2: #bc8cff; --green: #3fb950; --orange: #d29922; --red: #f85149; --yellow: #e3b341;
    --radius: 10px; --shadow: 0 2px 12px rgba(0,0,0,0.3);
    --sidebar-w: 260px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg); color: var(--text); line-height: 1.6; direction: rtl;
  }
  /* ---- الهيكل العام ---- */
  .app-layout { display: flex; height: 100vh; }
  /* ---- الشريط الجانبي ---- */
  .sidebar {
    width: var(--sidebar-w); min-width: var(--sidebar-w);
    background: var(--surface); border-left: 1px solid var(--border);
    display: flex; flex-direction: column; overflow-y: auto; z-index: 50;
    transition: transform 0.3s ease;
  }
  .sidebar-header {
    padding: 20px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 10px;
  }
  .sidebar-header h2 {
    font-size: 20px; font-weight: 700;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  }
  .version { font-size: 11px; color: var(--text3); background: var(--surface2); padding: 2px 8px; border-radius: 10px; }
  .sidebar-nav { padding: 8px 0; flex: 1; }
  .nav-item {
    display: flex; align-items: center; gap: 10px; padding: 10px 20px;
    cursor: pointer; transition: background 0.15s; color: var(--text2); font-size: 14px;
  }
  .nav-item:hover { background: var(--surface2); color: var(--text); }
  .nav-item.active { background: rgba(88,166,255,0.1); color: var(--accent); border-right: 3px solid var(--accent); }
  .nav-icon { font-size: 18px; width: 24px; text-align: center; }
  /* ---- المنطقة الرئيسية ---- */
  .main-area { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  .topbar {
    height: 56px; background: rgba(22,27,34,0.85); backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border); display: flex; align-items: center;
    padding: 0 20px; gap: 16px; z-index: 40; flex-shrink: 0;
  }
  .menu-toggle { display: none; background: none; border: none; color: var(--text); font-size: 22px; cursor: pointer; padding: 4px; }
  .topbar-title { font-size: 16px; font-weight: 600; flex: 1; }
  .topbar-actions { display: flex; gap: 8px; }
  .icon-btn {
    width: 36px; height: 36px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--surface2); color: var(--text2); display: flex;
    align-items: center; justify-content: center; cursor: pointer; font-size: 16px;
    transition: all 0.15s;
  }
  .icon-btn:hover { background: var(--border); color: var(--text); }
  /* ---- شريط الحالة ---- */
  .status-bar {
    padding: 6px 20px; background: var(--surface2); border-bottom: 1px solid var(--border);
    display: flex; gap: 20px; font-size: 11px; color: var(--text3); flex-shrink: 0;
    overflow-x: auto; white-space: nowrap;
  }
  .status-bar strong { color: var(--text2); }
  /* ---- المحتوى الرئيسي ---- */
  .content-area {
    flex: 1; overflow-y: auto; padding: 20px; scroll-behavior: smooth;
  }
  .content-area::-webkit-scrollbar { width: 6px; }
  .content-area::-webkit-scrollbar-track { background: transparent; }
  .content-area::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  /* ---- التنقل السفلي (موبايل) ---- */
  .bottom-nav {
    display: none; height: 60px; background: var(--surface); border-top: 1px solid var(--border);
    flex-shrink: 0;
  }
  .bottom-nav-inner {
    display: flex; height: 100%;
  }
  .bnav-item {
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    cursor: pointer; color: var(--text3); font-size: 10px; gap: 2px; transition: color 0.15s;
  }
  .bnav-item.active { color: var(--accent); }
  .bnav-icon { font-size: 20px; }
  /* ---- الكروت والبطاقات ---- */
  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 20px; margin-bottom: 16px; transition: border-color 0.2s;
  }
  .card:hover { border-color: #484f58; }
  .card-title { font-size: 16px; font-weight: 600; margin-bottom: 8px; }
  .card-desc { font-size: 13px; color: var(--text2); }
  .grid-2 { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
  .grid-3 { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; }
  .grid-4 { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px; }
  /* ---- الأزرار ---- */
  .btn {
    display: inline-flex; align-items: center; gap: 6px; padding: 8px 18px;
    border-radius: 8px; border: 1px solid var(--border); font-size: 13px;
    cursor: pointer; transition: all 0.15s; font-family: inherit; white-space: nowrap;
  }
  .btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn-primary:hover { background: #79b8ff; }
  .btn-success { background: var(--green); border-color: var(--green); color: #fff; }
  .btn-success:hover { opacity: 0.9; }
  .btn-danger { background: var(--red); border-color: var(--red); color: #fff; }
  .btn-ghost { background: transparent; color: var(--text2); }
  .btn-ghost:hover { background: var(--surface2); color: var(--text); }
  .btn-lg { padding: 12px 28px; font-size: 15px; border-radius: 12px; }
  .btn-block { display: flex; justify-content: center; width: 100%; }
  /* ---- النماذج ---- */
  .form-group { margin-bottom: 14px; }
  .form-label { display: block; font-size: 13px; color: var(--text2); margin-bottom: 4px; font-weight: 500; }
  .form-input, .form-textarea, .form-select {
    width: 100%; padding: 10px 14px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--bg); color: var(--text); font-size: 14px; font-family: inherit;
    outline: none; transition: border-color 0.2s;
  }
  .form-input:focus, .form-textarea:focus, .form-select:focus {
    border-color: var(--accent); box-shadow: 0 0 0 3px rgba(88,166,255,0.15);
  }
  .form-textarea { min-height: 100px; resize: vertical; }
  /* ---- Toast ---- */
  .toast {
    position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%) translateY(80px);
    background: var(--surface); border: 1px solid var(--border); color: var(--text);
    padding: 12px 24px; border-radius: var(--radius); font-size: 14px; z-index: 1000;
    transition: transform 0.3s ease; box-shadow: 0 8px 32px rgba(0,0,0,0.4); max-width: 90vw;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }
  /* ---- Modal ---- */
  .modal-overlay {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 200;
    align-items: center; justify-content: center; padding: 20px;
  }
  .modal-overlay.active { display: flex; }
  .modal-box {
    background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
    width: 100%; max-width: 560px; max-height: 85vh; display: flex; flex-direction: column;
  }
  .modal-header {
    padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex;
    align-items: center; justify-content: space-between; flex-shrink: 0;
  }
  .modal-header h3 { font-size: 16px; }
  .modal-close { background: none; border: none; color: var(--text2); font-size: 20px; cursor: pointer; }
  .modal-body { padding: 20px; overflow-y: auto; flex: 1; }
  .modal-actions { padding: 12px 20px; border-top: 1px solid var(--border); display: flex; gap: 8px; justify-content: flex-start; flex-shrink: 0; }
  /* ---- Loading ---- */
  .loading-overlay {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.65); z-index: 300;
    align-items: center; justify-content: center;
  }
  .loading-overlay.active { display: flex; }
  .loading-box {
    background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
    padding: 32px 40px; text-align: center; min-width: 280px;
  }
  .spinner {
    width: 40px; height: 40px; border: 3px solid var(--border); border-top-color: var(--accent);
    border-radius: 50%; margin: 0 auto 16px; animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading-text { color: var(--text2); font-size: 14px; }
  /* ---- تقدم البناء ---- */
  .progress-bar { width: 100%; height: 6px; background: var(--surface2); border-radius: 3px; overflow: hidden; margin-top: 12px; }
  .progress-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent2)); border-radius: 3px; transition: width 0.3s; width: 0%; }
  /* ---- Overlay للشريط الجانبي ---- */
  .sidebar-overlay {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 45;
  }
  .sidebar-overlay.active { display: block; }
  /* ---- Badge ---- */
  .badge {
    display: inline-block; padding: 2px 8px; border-radius: 10px;
    font-size: 11px; font-weight: 600;
  }
  .badge-accent { background: rgba(88,166,255,0.15); color: var(--accent); }
  .badge-green { background: rgba(63,185,80,0.15); color: var(--green); }
  /* ---- Template Card ---- */
  .template-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 16px; cursor: pointer; transition: all 0.2s;
  }
  .template-card:hover { border-color: var(--accent); transform: translateY(-2px); box-shadow: var(--shadow); }
  .template-card .tc-icon { font-size: 28px; margin-bottom: 8px; }
  .template-card .tc-name { font-size: 14px; font-weight: 600; margin-bottom: 4px; }
  .template-card .tc-desc { font-size: 12px; color: var(--text2); line-height: 1.4; }
  .template-card .tc-cat { font-size: 11px; color: var(--text3); margin-top: 8px; }
  /* ---- Section Title ---- */
  .section-title { font-size: 18px; font-weight: 700; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
  .section-title .st-count { font-size: 12px; color: var(--text3); font-weight: 400; }
  /* ---- Responsive ---- */
  @media (max-width: 768px) {
    .sidebar {
      position: fixed; right: 0; top: 0; height: 100%; transform: translateX(100%);
    }
    .sidebar.open { transform: translateX(0); }
    .menu-toggle { display: flex; }
    .bottom-nav { display: block; }
    .content-area { padding: 14px; padding-bottom: 74px; }
    .grid-2 { grid-template-columns: 1fr; }
    .grid-3 { grid-template-columns: repeat(2, 1fr); }
    .grid-4 { grid-template-columns: repeat(2, 1fr); }
  }
  @media (max-width: 400px) {
    .grid-3, .grid-4 { grid-template-columns: 1fr; }
  }
  /* ---- مساعد ---- */
  .flex { display: flex; } .flex-col { flex-direction: column; } .flex-wrap { flex-wrap: wrap; }
  .items-center { align-items: center; } .justify-between { justify-content: space-between; } .gap-8 { gap: 8px; } .gap-12 { gap: 12px; } .gap-16 { gap: 16px; }
  .mt-8 { margin-top: 8px; } .mt-16 { margin-top: 16px; } .mt-24 { margin-top: 24px; } .mb-16 { margin-bottom: 16px; }
  .text-center { text-align: center; }
  .text-sm { font-size: 13px; } .text-xs { font-size: 11px; }
  .text-muted { color: var(--text2); } .text-accent { color: var(--accent); }
  .w-full { width: 100%; }
  .hidden { display: none !important; }
</style>
</head>
<body>

<div class="app-layout">
  <!-- Overlay للشريط الجانبي على الموبايل -->
  <div class="sidebar-overlay" id="overlay" onclick="document.getElementById('sidebar').classList.remove('open');this.classList.remove('active')"></div>

  <!-- الشريط الجانبي -->
  <aside class="sidebar" id="sidebar"></aside>

  <!-- المنطقة الرئيسية -->
  <div class="main-area">
    <!-- الشريط العلوي -->
    <header class="topbar">
      <button class="menu-toggle" onclick="document.getElementById('sidebar').classList.toggle('open');document.getElementById('overlay').classList.toggle('active')">☰</button>
      <span class="topbar-title" id="pageTitle">Bardom AI</span>
      <div class="topbar-actions">
        <button class="icon-btn" onclick="BardomApp.navigateTo('settings')" title="الإعدادات">⚙️</button>
      </div>
    </header>

    <!-- شريط الحالة -->
    <div class="status-bar" id="statusBar">
      <span>⏳ جاري التحميل...</span>
    </div>

    <!-- المحتوى -->
    <main class="content-area" id="mainContent">
      <div style="text-align:center;padding:60px 20px;color:var(--text2)">
        <div class="spinner"></div>
        <p style="margin-top:16px">جاري تحميل Bardom AI...</p>
      </div>
    </main>

    <!-- التنقل السفلي -->
    <nav class="bottom-nav" id="bottomNav"></nav>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<!-- Modal -->
<div class="modal-overlay" id="modal">
  <div class="modal-box">
    <div class="modal-header">
      <h3 id="modalTitle"></h3>
      <button class="modal-close" onclick="BardomApp.closeModal()">✕</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-actions" id="modalActions"></div>
  </div>
</div>

<!-- Loading -->
<div class="loading-overlay" id="loadingOverlay">
  <div class="loading-box">
    <div class="spinner"></div>
    <div class="loading-text" id="loadingText">جاري التحميل...</div>
    <div class="progress-bar" id="progressBar" style="display:none"><div class="progress-fill" id="progressFill"></div></div>
  </div>
</div>
